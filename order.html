<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยืนยันการสั่งซื้อ — SolGuard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="logo">SolGuard</div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้าทั้งหมด</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-heading">
          <h1>ยืนยันการสั่งซื้อ</h1>
          <p>กรอกข้อมูลให้ครบถ้วน ทีมงานจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="order-form">

          <div class="form-group">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" required>
          </div>

          <div class="form-group">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required>
          </div>

          <div class="form-group">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="form-group">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" required>
          </div>

          <div class="form-group">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" placeholder="เช่น สีที่ต้องการ หรือช่วงเวลาที่สะดวกให้ติดต่อกลับ"></textarea>
          </div>

          <button type="submit" class="btn btn--primary">ยืนยันสั่งซื้อ</button>

        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      &copy; 2026 SolGuard. ปกป้องผิวคุณจากแดดทุกวัน
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
